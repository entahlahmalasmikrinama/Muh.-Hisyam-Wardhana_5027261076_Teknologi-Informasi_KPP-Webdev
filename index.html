<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechJobs Portal - Jembatan Pelamar & Perusahaan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --accent: #43e97b;
            --dark: #1a1a2e;
            --light: #f8f9fa;
            --success: #28a745;
            --info: #17a2b8;
            --warning: #ffc107;
            --danger: #dc3545;
            --bg-color: #f8f9fa;
            --text-color: #333;
            --card-bg: #ffffff;
            --navbar-bg: rgba(255,255,255,0.95);
            --footer-bg: #212529;
        }

        
        .dark-mode {
            --primary: #8a9eff;
            --secondary: #a68bce;
            --accent: #5ef9a4;
            --dark: #121212;
            --light: #2d2d2d;
            --bg-color: #121212;
            --text-color: #f8f9fa;
            --card-bg: #1e1e1e;
            --navbar-bg: rgba(30,30,30,0.95);
            --footer-bg: #0d0d0d;
        }
        
        body { 
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        

        /* ========== NAVBAR ========== */
        .navbar-custom {
            background: var(--navbar-bg);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 30px rgba(0,0,0,0.1);
            padding: 15px 0;
            transition: all 0.3s ease;
        }
        

        .navbar-custom.scrolled {
            padding: 8px 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        

        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--primary) !important;
            display: flex;
            align-items: center;
        }
        

        .navbar-brand i {
            margin-right: 10px;
            font-size: 1.8rem;
        }
        

        .nav-link {
            font-weight: 500;
            margin: 0 10px;
            color: var(--text-color) !important;
            position: relative;
            padding: 8px 0 !important;
        }
        

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: width 0.3s ease;
        }
        

        .nav-link:hover::after,
        .nav-link.active::after {
            width: 100%;
        }


        /* ========== HERO SECTION ========== */
        .hero-section {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 160px 0 100px;
            position: relative;
            overflow: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        

        .hero-section::before {

            content: '';

            position: absolute;

            top: 0;

            left: 0;

            right: 0;

            bottom: 0;

            background: 

                radial-gradient(circle at 20% 80%, rgba(255,255,255,0.1) 0%, transparent 50%),

                radial-gradient(circle at 80% 20%, rgba(255,255,255,0.05) 0%, transparent 50%);

        }

        

        .hero-content {

            position: relative;

            z-index: 2;

        }

        

        .hero-title {

            font-size: 3.5rem;

            font-weight: 800;

            line-height: 1.2;

            margin-bottom: 1.5rem;

            background: linear-gradient(45deg, #fff 30%, #ffd700 100%);

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

            background-clip: text;

        }

        

        .hero-subtitle {

            font-size: 1.3rem;

            font-weight: 300;

            margin-bottom: 2rem;

            opacity: 0.9;

            max-width: 600px;

        }

        

        /* ========== CARDS ========== */

        .dashboard-card {

            background: var(--card-bg);

            border-radius: 20px;

            box-shadow: 0 10px 40px rgba(0,0,0,0.08);

            border: none;

            margin-bottom: 24px;

            transition: all 0.3s ease;

            color: var(--text-color);

        }

        

        .dashboard-card:hover {

            transform: translateY(-5px);

            box-shadow: 0 15px 50px rgba(0,0,0,0.12);

        }

        

        .position-card {

            background: var(--card-bg);

            border-radius: 20px;

            overflow: hidden;

            box-shadow: 0 10px 40px rgba(0,0,0,0.08);

            transition: all 0.4s ease;

            border: none;

            height: 100%;

            position: relative;

            color: var(--text-color);

        }

        

        .position-card:hover {

            transform: translateY(-15px);

            box-shadow: 0 20px 50px rgba(102, 126, 234, 0.15);

        }

        

        .position-card::before {

            content: '';

            position: absolute;

            top: 0;

            left: 0;

            right: 0;

            height: 5px;

            background: linear-gradient(90deg, var(--primary), var(--secondary));

        }

        

        /* ========== BUTTONS ========== */

        .btn-primary-custom {

            background: linear-gradient(135deg, var(--primary), var(--secondary));

            color: white;

            border: none;

            padding: 15px 35px;

            border-radius: 50px;

            font-weight: 600;

            transition: all 0.3s ease;

            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);

        }

        

        .btn-primary-custom:hover {

            transform: translateY(-3px);

            box-shadow: 0 15px 30px rgba(102, 126, 234, 0.4);

            color: white;

        }

        

        .btn-outline-primary-custom {

            border: 2px solid var(--primary);

            color: var(--primary);

            background: transparent;

            padding: 13px 33px;

            border-radius: 50px;

            font-weight: 600;

            transition: all 0.3s ease;

        }

        

        .btn-outline-primary-custom:hover {

            background: var(--primary);

            color: white;

        }

        

        .btn-success-custom {

            background: var(--success);

            color: white;

            border: none;

            padding: 10px 25px;

            border-radius: 5px;

        }

        

        /* ========== STATUS BADGES ========== */

        .status-badge {

            padding: 5px 15px;

            border-radius: 20px;

            font-size: 0.8rem;

            font-weight: 600;

            display: inline-block;

        }

        

        .status-pending {

            background-color: var(--warning);

            color: #000;

        }

        

        .status-recommended {

            background-color: var(--info);

            color: white;

        }

        

        .status-accepted {

            background-color: var(--success);

            color: white;

        }

        

        .status-rejected {

            background-color: var(--danger);

            color: white;

        }

        

        /* ========== LOGIN STYLES ========== */

        .login-container {

            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);

            min-height: 100vh;

            display: flex;

            align-items: center;

            padding: 40px 0;

        }

        

        /* ========== UPLOAD STYLES ========== */

        .upload-area {

            border: 2px dashed #dee2e6;

            border-radius: 10px;

            padding: 30px;

            text-align: center;

            background: var(--light);

            cursor: pointer;

            transition: all 0.3s ease;

        }

        

        .upload-area:hover {

            border-color: var(--primary);

            background: rgba(102, 126, 234, 0.05);

        }

        

        .upload-area.dragover {

            border-color: var(--primary);

            background: rgba(102, 126, 234, 0.1);

        }

        

        .upload-icon {

            font-size: 3rem;

            color: var(--primary);

            margin-bottom: 15px;

        }

        

        .file-preview {

            margin-top: 20px;

            text-align: center;

        }

        

        .file-preview img {

            max-width: 200px;

            max-height: 200px;

            border-radius: 10px;

            box-shadow: 0 5px 15px rgba(0,0,0,0.1);

            border: 3px solid var(--card-bg);

        }

        

        .file-info {

            margin-top: 10px;

            padding: 10px;

            background: var(--light);

            border-radius: 5px;

            display: inline-block;

        }

        

        .remove-file {

            color: #dc3545;

            cursor: pointer;

            margin-left: 10px;

        }

        

        .remove-file:hover {

            color: #c82333;

        }

                /* Efek saat posisi dipilih */
        .job-position-card {
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent; /* Border transparan default */
        }

        .job-position-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        /* KELAS PENTING: Ini yang membuat kartu menyala saat diklik */
        .job-position-card.selected {
            border-color: var(--primary) !important;
            background-color: rgba(102, 126, 234, 0.1) !important; /* Warna biru muda */
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.4);
        }

        /* ========== CHART STYLES ========== */

        .chart-card {

            background: var(--card-bg);

            border-radius: 20px;

            box-shadow: 0 10px 40px rgba(0,0,0,0.08);

            border: none;

            margin-bottom: 24px;

        }

        

        .chart-container {

            position: relative;

            height: 300px;

            width: 100%;

        }

        

        .chart-btn {

            transition: all 0.3s ease;

        }

        

        .chart-btn.active {

            background: linear-gradient(135deg, var(--primary), var(--secondary));

            color: white;

        }

        

        /* ========== TABLE STYLES ========== */

        .table {

            color: var(--text-color);

        }

        

        .table-hover tbody tr:hover {

            background-color: rgba(var(--primary-rgb), 0.1);

        }

        

        /* ========== FORM STYLES ========== */

        .form-control, .form-select {

            background-color: var(--card-bg);

            color: var(--text-color);

            border: 1px solid #dee2e6;

        }

        

        .form-control:focus, .form-select:focus {

            background-color: var(--card-bg);

            color: var(--text-color);

            border-color: var(--primary);

            box-shadow: 0 0 0 0.25rem rgba(102, 126, 234, 0.25);

        }

        

        /* ========== MODAL STYLES ========== */

        .modal-content {

            background-color: var(--card-bg);

            color: var(--text-color);

        }

        

        /* ========== ANIMATIONS ========== */

        @keyframes fadeInUp {

            from {

                opacity: 0;

                transform: translateY(30px);

            }

            to {

                opacity: 1;

                transform: translateY(0);

            }

        }

        

        .animate-fadeInUp {

            animation: fadeInUp 0.8s ease forwards;

        }

        

        .animate-delay-1 { animation-delay: 0.1s; }

        .animate-delay-2 { animation-delay: 0.2s; }

        .animate-delay-3 { animation-delay: 0.3s; }

        .animate-delay-4 { animation-delay: 0.4s; }

        

        /* ========== DARK MODE TOGGLE ========== */

        .theme-toggle {

            background: transparent;

            border: none;

            color: var(--text-color);

            font-size: 1.5rem;

            cursor: pointer;

            margin-left: 10px;

            transition: transform 0.3s ease;

        }

        

        .theme-toggle:hover {

            transform: rotate(30deg);

        }

        

        /* ========== RESPONSIVE ========== */

        @media (max-width: 768px) {

            .hero-title {

                font-size: 2.5rem;

            }

            

            .chart-container {

                height: 250px;

            }

            

            .file-preview img {

                max-width: 150px;

                max-height: 150px;

            }

        }

    </style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>


    
// ============================================
// SECTION 1: DATABASE FUNCTIONS
// ============================================
var DB = {
    // Users data
    getUsers: function() { 
        return JSON.parse(localStorage.getItem('users') || '[]'); 
    },
    saveUsers: function(u) { 
        localStorage.setItem('users', JSON.stringify(u)); 
    },
    
    // Companies data
    getCompanies: function() { 
        return JSON.parse(localStorage.getItem('companies') || '[]');   
    },
    saveCompanies: function(c) { 
        localStorage.setItem('companies', JSON.stringify(c)); 
    },
    
    // Recommendations data
    getRecommendations: function() { 
        return JSON.parse(localStorage.getItem('recommendations') || '[]'); 
    },
    saveRecommendations: function(r) { 
        localStorage.setItem('recommendations', JSON.stringify(r)); 
    },
    
    // Applications data (with CV and Photo)
    getApplications: function() { 
        return JSON.parse(localStorage.getItem('applications') || '[]'); 
    },
    saveApplications: function(a) { 
        localStorage.setItem('applications', JSON.stringify(a)); 
    },
    
    // Jobs data
    getJobs: function() { 
        return JSON.parse(localStorage.getItem('companyJobs') || '[]'); 
    },
    saveJobs: function(j) { 
        localStorage.setItem('companyJobs', JSON.stringify(j)); 
    },
    
    // Session management
    getUser: function() { 
        return JSON.parse(sessionStorage.getItem('currentUser') || 'null'); 
    },
    setUser: function(u) { 
        sessionStorage.setItem('currentUser', JSON.stringify(u)); 
    },
    clear: function() { 
        sessionStorage.removeItem('currentUser'); 
    },
    
    // Theme preference
    getTheme: function() {
        return localStorage.getItem('theme') || 'light';
    },
    saveTheme: function(theme) {
        localStorage.setItem('theme', theme);
    }
};

// ============================================
// SECTION 2: APPLICATION STATE
// ============================================
var state = { 
    user: DB.getUser(),
    view: 'landing',
    editId: null,
    cvData: null,
    fotoData: null,
    selectedPosition: null,
    viewingPosition: null,
    currentChart: 'bar',
    resetEmail: null,
    editingJob: null,
    theme: DB.getTheme()
};

// Apply theme on load
if (state.theme === 'dark') {
    document.body.classList.add('dark-mode');
}

// ============================================
// SECTION 3: RENDER FUNCTION
// ============================================
function render() {
    var app = document.getElementById('app');
    
    if (state.view === 'landing') {
        app.innerHTML = landingPage();
    } else if (state.view === 'forgot') {
        app.innerHTML = showForgotPassword();
    } else if (state.view === 'resetPassword') {
        app.innerHTML = showResetPasswordForm(state.resetEmail);
    } else if (state.view === 'positionDetail') {
        app.innerHTML = positionDetailPage();
    } else if (!state.user) {
        app.innerHTML = loginPage();
    } else if (state.user.role === 'admin') {
        app.innerHTML = adminPage();
    } else if (state.user.role === 'company') {
        app.innerHTML = companyPage();
    } else {
        app.innerHTML = userPage();
    }
    
    if (state.view === 'landing') {
        setTimeout(function() {
            window.addEventListener('scroll', handleScroll);
            handleScroll();
            initAnimations();
        }, 100);
    } else if (state.view === 'admin') {
        setTimeout(initCharts, 100);
    }
}

// ============================================
// SECTION 4: THEME TOGGLE FUNCTION
// ============================================
function toggleTheme() {
    if (state.theme === 'light') {
        state.theme = 'dark';
        document.body.classList.add('dark-mode');
    } else {
        state.theme = 'light';
        document.body.classList.remove('dark-mode');
    }
    
    // Simpan ke database/local storage
    DB.saveTheme(state.theme);
    
    // Update ikon tombol tanpa me-render ulang seluruh halaman (lebih smooth)
    updateThemeIcon();
}

// Tambahkan fungsi helper ini
function updateThemeIcon() {
    const btn = document.querySelector('.theme-toggle i');
    if (btn) {
        if (state.theme === 'dark') {
            btn.className = 'bi bi-sun-fill'; // Ikon Matahari saat mode gelap
        } else {
            btn.className = 'bi bi-moon-fill'; // Ikon Bulan saat mode terang
        }
    }
}

// ============================================
// SECTION 5: LANDING PAGE
// ============================================
function landingPage() {
    var positions = getPositions();
    var companyJobs = DB.getJobs();
    var allPositions = [...positions, ...companyJobs];
    
    var positionCards = allPositions.map(pos => {
        var isCompanyJob = pos.companyName ? true : false;
        var badge = isCompanyJob ? 
            `<span class="badge bg-success">Lowongan Perusahaan</span>` : 
            `<span class="badge bg-primary">${pos.type}</span>`;
        
        var companyInfo = isCompanyJob ? 
            `<div class="mb-2"><i class="bi bi-building"></i> ${pos.companyName}</div>` : '';
        
        return `
        <div class="col-lg-4 col-md-6 mb-4 animate-fadeInUp" style="animation-delay: ${pos.id * 0.1}s">
            <div class="card position-card h-100" onclick="showPositionDetail(${pos.id}, ${isCompanyJob})">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <i class="bi ${pos.icon} position-icon" style="font-size: 3rem; color: var(--primary);"></i>
                        ${badge}
                    </div>
                    ${companyInfo}
                    <h4 class="fw-bold mb-3">${pos.name}</h4>
                    <p class="text-muted mb-4">${pos.desc}</p>
                    <div class="text-primary fw-bold mb-3">${pos.salary}</div>
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span><i class="bi bi-briefcase me-2"></i>${pos.experience}</span>
                        <span><i class="bi bi-geo-alt me-2"></i>${pos.location}</span>
                    </div>
                    <button class="btn btn-primary-custom w-100">
                        <i class="bi bi-arrow-right me-2"></i>Pelajari Selengkapnya
                    </button>
                </div>
            </div>
        </div>
        `;
    }).join('');
    
    return `
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom fixed-top">
        <div class="container">
            <a class="navbar-brand" href="#" onclick="state.view='landing';render()">
                <i class="bi bi-briefcase-fill"></i> TechJobs Portal
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#home">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#positions">Lowongan</a></li>
                    <li class="nav-item"><a class="nav-link" href="#about">Tentang</a></li>
                    <li class="nav-item"><a class="nav-link" href="#process">Proses</a></li>
                </ul>
                <div class="d-flex align-items-center">
                   <button class="theme-toggle" onclick="toggleTheme()">
                        <i class="bi ${state.theme === 'light' ? 'bi-moon-fill' : 'bi-sun-fill'}"></i>
                    </button>
                    <button class="btn btn-outline-primary-custom me-2" onclick="state.view='login';render()">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Login
                    </button>
                    <button class="btn btn-primary-custom" onclick="showRegisterOptions()">
                        <i class="bi bi-person-plus me-2"></i>Daftar
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero-section" id="home">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-6 hero-content animate-fadeInUp">
                    <div class="d-flex align-items-center bg-white bg-opacity-10 p-3 rounded-pill mb-4 animate-delay-1" style="backdrop-filter: blur(10px); max-width: fit-content;">
                        <i class="bi bi-star-fill text-warning me-2"></i>
                        <span>#1 Platform Rekrutmen IT di Indonesia</span>
                    </div>
                    <h1 class="hero-title animate-delay-2">
                        Jembatan Antara<br>
                        <span style="background: linear-gradient(45deg, #ffd700, #ff8c00); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Talenta & Perusahaan</span>
                    </h1>
                    <p class="hero-subtitle animate-delay-3">
                        Admin kami akan membantu merekomendasikan Anda ke perusahaan yang tepat. 
                        Bergabunglah dengan ribuan profesional IT yang telah mengembangkan karir mereka.
                    </p>
                    <div class="d-flex flex-wrap gap-3 animate-delay-4">
                        <button class="btn btn-primary-custom" onclick="state.view='login';render()">
                            <i class="bi bi-rocket-takeoff me-2"></i>Mulai Sekarang
                        </button>
                        <button class="btn btn-outline-light" onclick="document.getElementById('positions').scrollIntoView({behavior:'smooth'})">
                            <i class="bi bi-search me-2"></i>Lihat Lowongan
                        </button>
                    </div>
                </div>
                <div class="col-lg-6 animate-fadeInUp">
                    <img src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80" 
                         alt="Tech Team" class="img-fluid rounded-3 shadow-lg">
                </div>
            </div>
        </div>
    </section>

    <!-- Positions Section -->
    <section class="py-5" id="positions">
        <div class="container py-5">
            <div class="text-center mb-5">
                <h2 class="fw-bold" style="font-size: 2.8rem; color: var(--dark); position: relative; display: inline-block;">
                    Posisi yang Tersedia
                    <div style="position: absolute; bottom: -10px; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, var(--primary), var(--secondary)); border-radius: 2px;"></div>
                </h2>
                <p class="text-muted fs-5 mt-4">
                    Temukan pekerjaan IT yang sesuai dengan keahlian dan passion Anda.
                </p>
            </div>
            <div class="row">
                ${positionCards}
            </div>
        </div>
    </section>

    <!-- About Section -->
    <section class="py-5 bg-light" id="about">
        <div class="container py-5">
            <div class="text-center mb-5">
                <h2 class="fw-bold" style="font-size: 2.8rem; color: var(--dark); position: relative; display: inline-block;">
                    Tentang Kami
                    <div style="position: absolute; bottom: -10px; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, var(--primary), var(--secondary)); border-radius: 2px;"></div>
                </h2>
            </div>
            <div class="row g-4">
                <div class="col-md-4 text-center">
                    <div class="p-4 dashboard-card h-100">
                        <div class="rounded-circle bg-primary d-inline-flex align-items-center justify-content-center mb-4" style="width: 80px; height: 80px;">
                            <i class="bi bi-person-fill text-white" style="font-size: 2rem;"></i>
                        </div>
                        <h4 class="fw-bold mb-3">Untuk Pelamar</h4>
                        <p class="text-muted">Dapatkan rekomendasi ke perusahaan terbaik sesuai keahlian Anda</p>
                    </div>

function doLogin() {
    var email = document.getElementById('lEmail').value;
    var pass = document.getElementById('lPass').value;
    
    if (!email || !pass) {
        alert('Isi email dan password!');
        return;
    }

    // Menggunakan Fetch API ke PHP
    fetch('login.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: pass })
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === 'success') {
            state.user = data.user;
            DB.setUser(state.user); // Simpan ke session storage agar tidak hilang saat refresh
            render();
        } else {
            alert(data.message);
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('Terjadi kesalahan koneksi server');
    });
}

function sendResetCode() {
    var email = document.getElementById('resetEmail').value;
    if (!email) {
        alert('Harap masukkan email Anda!');
        return;
    }
    
    var users = DB.getUsers();
    var companies = DB.getCompanies();
    
    // Check if email exists in users or companies
    var user = users.find(u => u.email === email);
    var company = companies.find(c => c.email === email);
    
    if (!user && !company) {
        alert('Email tidak terdaftar dalam sistem!');
        return;
    }
    
    // Generate 6-digit reset code
    var resetCode = Math.floor(100000 + Math.random() * 900000).toString();
    
    // Save to session storage
    sessionStorage.setItem('resetCode_' + email, resetCode);
    sessionStorage.setItem('resetEmail', email);
    sessionStorage.setItem('resetExpiry_' + email, Date.now() + (30 * 60 * 1000)); // 30 minutes
    
    alert(`Kode reset telah dikirim ke ${email}\n\nKode reset: ${resetCode}\n\n(catatan: ini hanya simulasi)`);
    
    state.resetEmail = email;
    state.view = 'resetPassword';
    render();
}

function resetPassword(email) {
    var codeInput = document.getElementById('resetCode').value;
    var newPass = document.getElementById('newPassword').value;
    var confirmPass = document.getElementById('confirmPassword').value;
    
    if (!codeInput || !newPass || !confirmPass) {
        alert('Harap isi semua field!');
        return;
    }
    
    if (newPass.length < 6) {
        alert('Password minimal 6 karakter!');
        return;
    }
    
    if (newPass !== confirmPass) {
        alert('Password baru dan konfirmasi password tidak sama!');
        return;
    }
    
    var storedCode = sessionStorage.getItem('resetCode_' + email);
    var expiryTime = sessionStorage.getItem('resetExpiry_' + email);
    
    if (!storedCode) {
        alert('Kode reset tidak valid!');
        return;
    }
    
    if (Date.now() > expiryTime) {
        alert('Kode reset telah kedaluwarsa! (berlaku 30 menit)');
        sessionStorage.removeItem('resetCode_' + email);
        sessionStorage.removeItem('resetExpiry_' + email);
        state.view = 'forgot';
        render();
        return;
    }
    
    if (codeInput !== storedCode) {
        alert('Kode reset tidak valid!');
        return;
    }
    
    // Update password in users
    var users = DB.getUsers();
    var userIndex = users.findIndex(u => u.email === email);
    if (userIndex !== -1) {
        users[userIndex].password = newPass;
        DB.saveUsers(users);
    }
    
    // Update password in companies
    var companies = DB.getCompanies();
    var companyIndex = companies.findIndex(c => c.email === email);
    if (companyIndex !== -1) {
        companies[companyIndex].password = newPass;
        DB.saveCompanies(companies);
    }
    
    // Clear reset data
    sessionStorage.removeItem('resetCode_' + email);
    sessionStorage.removeItem('resetExpiry_' + email);
    sessionStorage.removeItem('resetEmail');
    
    alert('Password berhasil direset! Silakan login dengan password baru Anda.');
    state.view = 'login';
    render();
}

    var recommendationRows = recommendations.map(r => {

                         r.status === 'rejected' ? 'status-rejected' : 
                         r.status === 'recommended' ? 'status-recommended' : 'status-pending';
        var statusText = r.status === 'accepted' ? 'Diterima' : 
                        r.status === 'rejected' ? 'Ditolak' : 
                        r.status === 'recommended' ? 'Direkomendasikan' : 'Menunggu';
        
        return `<tr>
            <td>${company ? company.name : 'Perusahaan'}</td>
            <td>${r.position}</td>
            <td>${r.adminMessage || '-'}</td>
            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
            <td>${r.companyDecision ? r.companyDecision : '-'}</td>
        </tr>`;

function selectPosition(id) {

    allCards.forEach(card => card.classList.remove('selected'));

    // 3. Tambahkan kelas 'selected' ke kartu yang DIKLIK
    var targetCard = document.getElementById('pos-card-' + id);
    if (targetCard) {
        targetCard.classList.add('selected');
    }

// 2. FUNGSI MEMPROSES FILE (Menampilkan Indikator)
// ============================================
function handleFileSelect(e, type) {
    var file = e.target.files[0];
    if (!file) return;

    // Validasi Ukuran (2MB)
    if (file.size > 2 * 1024 * 1024) {
        alert("File terlalu besar! Maksimal 2MB.");
        return;
    }

    if (type === 'cv') {
        state.cvFile = file; // Simpan ke memory
        
        // Tampilkan Nama File PDF
        var preview = document.getElementById('cv-preview-area');
        preview.innerHTML = `
            <div class="alert alert-danger d-flex align-items-center mb-0 shadow-sm">
                <i class="bi bi-file-earmark-pdf-fill fs-3 me-3"></i>
                <div class="overflow-hidden">
                    <small class="text-uppercase fw-bold text-muted" style="font-size:0.7rem">FILE TERPILIH</small>
                    <div class="fw-bold text-truncate" style="max-width: 200px;">${file.name}</div>
                    <small>${(file.size/1024).toFixed(1)} KB</small>
                </div>
            </div>`;
            
    } else {
        state.fotoFile = file; // Simpan ke memory
        
        // Tampilkan Preview Gambar
        var reader = new FileReader();
        reader.onload = function(evt) {
            var preview = document.getElementById('foto-preview-area');
            preview.innerHTML = `
                <div class="card border-primary shadow-sm text-center p-2">
                    <img src="${evt.target.result}" class="img-fluid rounded" style="max-height: 150px; object-fit: cover; margin: 0 auto;">
                    <div class="mt-2 small fw-bold text-primary text-truncate">${file.name}</div>
                </div>`;
        };
        reader.readAsDataURL(file);
    }
}

// ============================================
// UPDATE FUNGSI SUBMIT
// ============================================
function submitApplication() {
    // 1. Validasi
    if (!state.user || !state.user.id) {
        alert('Sesi habis. Silakan login ulang.');
        return;
    }

    var position = getPositions().find(p => p.id === state.selectedPosition);
    var letter = document.getElementById('applicationLetter').value;
    
    if (!state.selectedPosition) {
        alert('Pilih posisi yang ingin dilamar terlebih dahulu!');
        return;
    }
    
    if (!state.cvFile) {
        alert('CV Wajib diupload!');
        return;
    }

    // 2. Siapkan Data
    var formData = new FormData();
    formData.append('user_id', state.user.id);
    formData.append('posisi', position.name);
    formData.append('surat_lamaran', letter);
    
    if (state.cvFile) formData.append('cv', state.cvFile); 
    if (state.fotoFile) formData.append('foto', state.fotoFile);

    // Ubah tombol jadi Loading
    var btn = event.target; // Tombol yang diklik
    var oldText = btn.innerHTML;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Mengirim...';
    btn.disabled = true;

    // 3. Kirim ke Server
    fetch('http://localhost/techjobs/submit_application.php', {
        method: 'POST',
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        // Balikin tombol
        btn.innerHTML = oldText;
        btn.disabled = false;

        if (data.status === 'success') {
            // Tampilkan Notifikasi Sukses
            alert("✅ " + data.message);
            
            // --- BAGIAN PENTING: RESET & STAY ---
            
            // 1. Bersihkan State File
            state.cvFile = null;
            state.fotoFile = null;
            state.selectedPosition = null;
            
            // 2. Tutup Form Lamaran (Bersihkan HTML area form)
            document.getElementById('applicationFormArea').innerHTML = '';
            
            // 3. PANGGIL USERPAGE() UNTUK REFRESH DATA TABEL
            // Jangan pakai location.reload() atau render()
            userPage(); 
            
        } else {
            alert('❌ Gagal: ' + data.message);
        }
    })
    .catch(error => {
        console.error('Error:', error);
        btn.innerHTML = oldText;
        btn.disabled = false;
        alert('Terjadi kesalahan koneksi server.');
    });
}

function editApplication(id) {

    if (app) {

        state.selectedPosition = getPositions().findIndex(p => p.name === app.posisi) + 1;
        document.getElementById('applicationLetter').value = app.surat_lamaran;
        toggleApplicationForm();

function updateProfile() {
    var skills = document.getElementById('updateSkills').value;
    var experience = document.getElementById('updateExperience').value;
    
    var users = DB.getUsers();
    users = users.map(user => {
        if (user.id === state.user.id) {
            user.skills = skills;
            user.experience = experience;
        }
        return user;
    });
    
    DB.saveUsers(users);
    state.user.skills = skills;
    state.user.experience = experience;
    DB.setUser(state.user);
    
    closeModal();
    render();
}

// --- FUNGSI KIRIM DATA ---
function sendRecommendation(userId) {
    var companyId = document.getElementById('recCompanyId').value;
    var position = document.getElementById('recPosition').value;
    var message = document.getElementById('recMessage').value;

    // Validasi di sisi Client
    if (!userId) {
        alert('Error Fatal: User ID hilang!');
        return;
    }
    if (!companyId) {
        alert('Harap pilih perusahaan tujuan terlebih dahulu!');
        return;
    }

    // Tampilkan loading
    var btn = event.target; // Tombol yang diklik
    btn.innerHTML = "Mengirim...";
    btn.disabled = true;

    var payload = {
        user_id: userId,
        company_id: companyId,
        position: position,
        message: message
    };

// ... kode sebelumnya ...
    
    console.log("Mengirim Payload:", payload);

    // GANTI baris fetch menjadi alamat lengkap seperti ini:
    fetch('http://localhost/techjobs/submit_recommendation.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    })
    
    // ... kode selanjutnya ...
    .then(response => response.json())
    .then(data => {
        if (data.status === 'success') {
            alert(data.message);
            closeModal();
        } else {
            alert('Gagal: ' + data.message);
            // Reset tombol jika gagal
            btn.innerHTML = '<i class="bi bi-send me-2"></i>Kirim Rekomendasi';
            btn.disabled = false;
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('Terjadi kesalahan koneksi server. Cek console.');
        btn.disabled = false;
    });
}

// --- UPDATE FUNGSI CREATE JOB ---
function createJob() {
    // Ambil value dari form
    var payload = {
        company_id: state.user.id,
        name: document.getElementById('jobTitle').value,
        type: document.getElementById('jobType').value,
        category: document.getElementById('jobCategory').value,
        location: document.getElementById('jobLocation').value,
        salary: document.getElementById('jobSalary').value,
        experience: document.getElementById('jobExperience').value,
        desc: document.getElementById('jobDescription').value,
        requirements: document.getElementById('jobRequirements').value,
        benefits: document.getElementById('jobBenefits').value,
        icon: document.getElementById('jobIcon').value
    };

    // Validasi Sederhana
    if (!payload.name || !payload.salary || !payload.location) {
        alert('Harap isi Nama Posisi, Gaji, dan Lokasi!');
        return;
    }

    // Kirim ke Database
    fetch('http://localhost/techjobs/create_job.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === 'success') {
            alert(data.message);
            cancelJobForm(); // Tutup form
            companyPage();   // Refresh data di halaman
        } else {
            alert('Gagal: ' + data.message);
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('Terjadi kesalahan koneksi saat membuat lowongan.');
    });
}

function updateJob() {
    var title = document.getElementById('jobTitle').value;
    var type = document.getElementById('jobType').value;
    var category = document.getElementById('jobCategory').value;
    var location = document.getElementById('jobLocation').value;
    var salary = document.getElementById('jobSalary').value;
    var experience = document.getElementById('jobExperience').value;
    var description = document.getElementById('jobDescription').value;
    var requirements = document.getElementById('jobRequirements').value;
    var benefits = document.getElementById('jobBenefits').value;
    var icon = document.getElementById('jobIcon').value;
    
    if (!title || !description || !salary || !location) {
        alert('Harap isi semua field yang wajib!');
        return;
    }
    
    var jobs = DB.getJobs();
    jobs = jobs.map(job => {
        if (job.id === state.editingJob) {
            return {
                ...job,
                name: title,
                type: type,
                category: category,
                location: location,
                salary: salary,
                experience: experience,
                desc: description,
                requirements: requirements,
                benefits: benefits,
                icon: icon
            };
        }
        return job;
    });
    
    DB.saveJobs(jobs);
    
    alert('Lowongan pekerjaan berhasil diupdate!');
    state.editingJob = null;
    render();
}

// --- UPDATE HELPER RENDER BARIS ---
function renderApplicationRows(applications) {
    if (!applications || applications.length === 0) {
        return '<tr><td colspan="7" class="text-center py-4">Belum ada lamaran masuk</td></tr>';
    }

    return applications.map(app => {
        // Link CV & Foto
        var cvLink = app.cv_path 
            ? `<a href="uploads/cv/${app.cv_path}" target="_blank" class="btn btn-sm btn-outline-danger"><i class="bi bi-file-pdf"></i> PDF</a>` 
            : '<span class="badge bg-secondary">No CV</span>';

        var fotoLink = app.foto_path 
            ? `<a href="uploads/foto/${app.foto_path}" target="_blank" class="btn btn-sm btn-outline-info"><i class="bi bi-image"></i> Foto</a>` 
            : '<span class="badge bg-secondary">No Foto</span>';

        // --- LOGIKA WARNA BADGE (PENTING) ---
        // Karena PHP sudah mengirim 'Diterima'/'Ditolak', kita tinggal warnai saja
        var badgeColor = 'bg-warning text-dark'; // Default Pending
        var btnState = ''; // Tombol aktif

        if (app.status === 'Diterima') {
            badgeColor = 'bg-success';
            btnState = 'disabled'; // Matikan tombol jika sudah diterima
        } else if (app.status === 'Ditolak') {
            badgeColor = 'bg-danger';
        }

        return `
        <tr>
            <td>
                <div class="fw-bold">${app.nama}</div>
                <div class="small text-muted">${app.email}</div>
            </td>
            <td>${app.posisi}</td>
            <td>${app.cv_path ? 'Ada' : '-'}</td>
            <td>
                <div class="d-flex gap-1">${cvLink}${fotoLink}</div>
            </td>
            <td><span class="badge ${badgeColor}">${app.status}</span></td>
            <td>
                <button class="btn btn-sm btn-primary" ${btnState} onclick="showRecommendModal(${app.user_id}, '${app.nama}', '${app.posisi}')">
                    <i class="bi bi-arrow-right-circle"></i> Rekomendasi
                </button>
            </td>
        </tr>`;
    }).join('');
}

// --- HELPER 2: Render Charts (Disesuaikan dengan Data Real) ---
function renderAdminCharts(applications) {
    // 1. Data untuk Position Chart (Bar)
    var positionCount = {};
    applications.forEach(a => {
        positionCount[a.posisi] = (positionCount[a.posisi] || 0) + 1;
    });

    new Chart(document.getElementById('positionChart'), {
        type: 'bar',
        data: {
            labels: Object.keys(positionCount),
            datasets: [{
                label: 'Jumlah Pelamar',
                data: Object.values(positionCount),
                backgroundColor: '#667eea',
                borderRadius: 5
            }]
        },
        options: { responsive: true, maintainAspectRatio: false }
    });

    // 2. Data untuk Status Chart (Pie)
    var statusCount = {
        'Pending': applications.filter(a => a.status === 'Pending').length,
        'Diterima': applications.filter(a => a.status === 'Diterima').length,
        'Ditolak': applications.filter(a => a.status === 'Ditolak').length
    };

    new Chart(document.getElementById('statusChart'), {
        type: 'doughnut',
        data: {
            labels: Object.keys(statusCount),
            datasets: [{
                data: Object.values(statusCount),
                backgroundColor: ['#ffc107', '#28a745', '#dc3545']
            }]
        },
        options: { responsive: true, maintainAspectRatio: false }
    });
}

function renderCharts() {
    var applications = DB.getApplications();
    var positions = getPositions();
    
    // Position Chart
    var positionCount = {};
    positions.forEach(pos => {
        positionCount[pos.name] = applications.filter(a => a.posisi === pos.name).length;

function renderChart(canvasId, labels, data, colors, title) {
    var ctx = document.getElementById(canvasId);
    if (!ctx) return;
    
    if (chartInstances[canvasId]) {
        chartInstances[canvasId].destroy();
    }
    
    var config = {
        type: state.currentChart,
        data: {
            labels: labels,
            datasets: [{
                label: 'Jumlah',
                data: data,
                backgroundColor: colors,
                borderColor: colors.map(color => color.replace('0.8', '1')),
                borderWidth: 2
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: 'top',
                },
                title: {
                    display: true,
                    text: title,
                    font: {
                        size: 16,
                        weight: 'bold'
                    }
                }
            },
            animation: {
                duration: 1000,
                easing: 'easeOutQuart'
            }
        }
    };
    
    if (state.currentChart === 'bar') {
        config.options.scales = {
            y: {
                beginAtZero: true,
                ticks: {
                    stepSize: 1
                }
            }
        };
    }
    
    chartInstances[canvasId] = new Chart(ctx, config);
}

function renderTrendChart() {
    var ctx = document.getElementById('trendChart');
    if (!ctx) return;
    
    var applications = DB.getApplications();
    var trendData = {};
    var today = new Date();
    
    for (var i = 6; i >= 0; i--) {
        var date = new Date();
        date.setDate(today.getDate() - i);
        var dateStr = date.toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric' });
        trendData[dateStr] = 0;
    }
    
    applications.forEach(function(app) {
        var appDate = new Date(app.tanggal.split('/').reverse().join('-'));
        var diffDays = Math.floor((today - appDate) / (1000 * 60 * 60 * 24));
        
        if (diffDays >= 0 && diffDays <= 6) {
            var dateStr = appDate.toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric' });
            trendData[dateStr]++;
        }
    });
    
    var trendLabels = Object.keys(trendData);
    var trendValues = Object.values(trendData);
    
    if (chartInstances['trendChart']) {
        chartInstances['trendChart'].destroy();
    }
    
    chartInstances['trendChart'] = new Chart(ctx, {
        type: 'line',
        data: {
            labels: trendLabels,
            datasets: [{
                label: 'Lamaran per Hari',
                data: trendValues,
                borderColor: '#667eea',
                backgroundColor: 'rgba(102, 126, 234, 0.1)',
                borderWidth: 3,
                fill: true,
                tension: 0.4
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: 'top',
                },
                title: {
                    display: true,
                    text: 'Trend Lamaran 7 Hari Terakhir',
                    font: {
                        size: 16,
                        weight: 'bold'
                    }
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        stepSize: 1
                    }
                }
            }
        }
    });
}

function exportChartData() {
    var applications = DB.getApplications();
    var positions = getPositions();
    
    var positionData = {};
    positions.forEach(pos => {
        positionData[pos.name] = applications.filter(a => a.posisi === pos.name).length;
    });
    
    var statusData = {
        'Pending': applications.filter(a => a.status === 'Pending').length,
        'Diterima': applications.filter(a => a.status === 'Diterima').length,
        'Ditolak': applications.filter(a => a.status === 'Ditolak').length
    };
    
    var csvContent = "Posisi,Jumlah Pelamar\n";
    Object.keys(positionData).forEach(pos => {
        csvContent += pos + "," + positionData[pos] + "\n";
    });
    
    csvContent += "\nStatus,Jumlah\n";
    Object.keys(statusData).forEach(status => {
        csvContent += status + "," + statusData[status] + "\n";
    });
    
    var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    var link = document.createElement("a");
    var url = URL.createObjectURL(blob);
    link.setAttribute("href", url);
    link.setAttribute("download", "data_pelamar_" + new Date().toISOString().split('T')[0] + ".csv");
    link.style.visibility = 'hidden';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    
    alert('Data berhasil diexport!');
}

function handleFileSelect(e, type) {
    var file = e.target.files[0];
    if (!file) return;
    
    var maxSize = type === 'cv' ? 2 * 1024 * 1024 : 1 * 1024 * 1024; // 2MB & 1MB
    if (file.size > maxSize) {
        alert('Ukuran file terlalu besar!');
        return;
    }
    
    // Simpan file object untuk dikirim ke PHP nanti
    if (type === 'cv') {
        state.cvFile = file; // <--- PENTING: Simpan file object
    } else {
        state.fotoFile = file; // <--- PENTING: Simpan file object
    }
    
    // Preview Logic (Base64) - Tetap dipakai untuk tampilan preview di layar
    var reader = new FileReader();
    reader.onload = function(e) {
        if (type === 'cv') {
            state.cvData = e.target.result; // Untuk preview visual
        } else {
            state.fotoData = e.target.result; // Untuk preview visual
        }
        toggleApplicationForm(); // Refresh tampilan form
    };
    reader.readAsDataURL(file);
}
